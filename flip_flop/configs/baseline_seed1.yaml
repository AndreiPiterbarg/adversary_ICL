# Second-seed canonical baseline (PLAN_beat_liu_r4 Sec.2.D two-checkpoint
# filter). IDENTICAL to baseline.yaml in every respect except training.seed
# (0 -> 1) and output.out_dir. One-time ~2h retrain; reused for all adversary
# rounds and both eval passes. Architecture/optimizer/data MUST match
# baseline.yaml exactly so the two checkpoints differ ONLY by RNG seed.

model:
  family: gpt2
  vocab_size: 5
  n_positions: 512
  n_embd: 512
  n_layer: 6
  n_head: 8
  resid_pdrop: 0.0
  embd_pdrop: 0.0
  attn_pdrop: 0.0

data:
  seq_len: 512
  train_p_i: 0.8
  eval_in_p_i: 0.8
  eval_sparse_p_i: 0.98
  eval_dense_p_i: 0.1
  eval_in_n: 1000
  eval_sparse_n: 100000
  eval_dense_n: 3000
  eval_seed: 1

training:
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.999
  warmup_steps: 50
  train_steps: 10000
  decay_end_step: 10001
  batch_size: 16
  grad_clip: 1.0
  seed: 1                      # the ONLY substantive change vs baseline.yaml
  eval_every: 500
  training_eval_subset: 1000
  log_every: 50
  save_every: 2000
  eval_batch_size: 64
  device: auto

output:
  out_dir: results/flip_flop/baseline_seed1
